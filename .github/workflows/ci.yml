name: ci

# Runs on the self-hosted ARC scale set `safewords-runners` (DinD mode).
# Pull requests from forks never run on self-hosted runners: they could execute
# arbitrary code inside the cluster hosting the runners.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: safewords-runners
    permissions:
      contents: read
      # Lets a push to main ask the cluster's compile cache for write access
      # (ci-cache-setup); pull requests only read it.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Everything in the pinned Rust Alpine image (natively musl, as the
      # published binary is built), through sccache on the cluster's cache.
      - name: fmt, clippy, tests, CRDs (rust Alpine)
        run: >-
          hack/ci-alpine.sh 'rustup component add clippy rustfmt 2>/dev/null
          && cargo fmt --check
          && cargo clippy --all-targets --locked -- -D warnings
          && cargo test --locked
          && sh hack/gen-crds.sh'
      - name: CRDs in the chart are up to date
        run: git diff --exit-code charts/kube-hardware-autoscaler/crds/

  chart:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
      - run: helm lint charts/kube-hardware-autoscaler
      - run: helm template t charts/kube-hardware-autoscaler --set hostNetwork=true > /dev/null

  image:
    # On a push to main, publish.yml builds, smoke-tests and pushes the same
    # image; this job is for pull requests (and manual runs) only.
    if: github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: safewords-runners
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # The static musl binary, built in Alpine; the image only copies it in.
      - name: Release binary (rust Alpine, musl)
        run: >-
          hack/ci-alpine.sh 'cargo build --release --locked
          && mkdir -p dist/amd64 && cp target/release/kube-hardware-autoscaler dist/amd64/'
      - run: docker build --build-arg TARGETARCH=amd64 -t kube-hardware-autoscaler:ci .
      - run: docker run --rm kube-hardware-autoscaler:ci drivers
