name: ci

# Runs on the self-hosted ARC scale set `safewords-runners` (DinD mode).
# Pull requests from forks never run on self-hosted runners: they could execute
# arbitrary code inside the cluster hosting the runners.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: safewords-runners
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: CRDs in the chart are up to date
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh hack/gen-crds.sh
          git diff --exit-code charts/kube-hardware-autoscaler/crds/

  chart:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/kube-hardware-autoscaler
      - run: helm template t charts/kube-hardware-autoscaler --set hostNetwork=true > /dev/null

  image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kube-hardware-autoscaler:ci .
      - run: docker run --rm kube-hardware-autoscaler:ci drivers

