name: publish

# Runs on the self-hosted ARC scale set `safewords-runners` (DinD mode).
#
# main    -> ghcr.io/<owner>/kube-hardware-autoscaler:main, :sha-<short>   (linux/amd64)
# v1.2.3  -> ...:1.2.3, :1.2, :latest                        (linux/amd64 + linux/arm64)
#            + Helm chart oci://ghcr.io/<owner>/charts/kube-hardware-autoscaler:1.2.3
#            + GitHub release with the chart and CRDs attached
#
# arm64 is built under QEMU emulation on the amd64 runners (slow, but no hosted
# runner minutes), so only for releases.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kube-hardware-autoscaler

jobs:
  image:
    runs-on: safewords-runners
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set platforms
        id: platforms
        run: |
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: contains(steps.platforms.outputs.list, 'arm64')
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.list }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache lives in GHCR rather than the GitHub Actions cache service.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: safewords-runners
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
      - name: Package chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/kube-hardware-autoscaler --version "$version" --app-version "$version" -d dist
          cp charts/kube-hardware-autoscaler/crds/*.yaml dist/crds.yaml
      - name: Push chart to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/kube-hardware-autoscaler-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! command -v gh >/dev/null; then
            curl -sSL https://github.com/cli/cli/releases/download/v2.63.2/gh_2.63.2_linux_amd64.tar.gz | tar xz -C /tmp
            export PATH="/tmp/gh_2.63.2_linux_amd64/bin:$PATH"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
