name: publish

# Runs on the self-hosted ARC scale set `safewords-runners` (DinD mode).
#
# main    -> ghcr.io/<owner>/kube-hardware-autoscaler:main, :sha-<short>
# v1.2.3  -> ...:1.2.3, :1.2, :latest
#            + Helm chart oci://ghcr.io/<owner>/charts/kube-hardware-autoscaler:1.2.3
#            + GitHub release with the chart and CRDs attached
#
# linux/amd64 only. The binary is compiled on the runner, in the pinned Rust
# Alpine image (static musl) through sccache on the cluster's compile cache;
# the image build only copies it into Alpine (Dockerfile), so there is no
# Docker layer cache to keep.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kube-hardware-autoscaler

jobs:
  image:
    runs-on: safewords-runners
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # Write access to the cluster's compile cache for pushes to main.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Release binary (rust Alpine, musl)
        run: >-
          hack/ci-alpine.sh 'cargo build --release --locked
          && mkdir -p dist/amd64 && cp target/release/kube-hardware-autoscaler dist/amd64/'
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # The runner's own Docker daemon (BuildKit built in): no buildx builder
      # container to start, and nothing to cache (the Dockerfile only copies
      # the binary into alpine).
      - name: Build, smoke-test and push the image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          args=(--build-arg TARGETARCH=amd64)
          while IFS= read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<<"$TAGS"
          while IFS= read -r l; do [ -n "$l" ] && args+=(--label "$l"); done <<<"$LABELS"
          docker build "${args[@]}" .
          first=$(head -n1 <<<"$TAGS")
          docker run --rm "$first" drivers >/dev/null
          while IFS= read -r t; do [ -n "$t" ] && docker push -q "$t"; done <<<"$TAGS"

  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: safewords-runners
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
      - name: Package chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/kube-hardware-autoscaler --version "$version" --app-version "$version" -d dist
          cp charts/kube-hardware-autoscaler/crds/*.yaml dist/crds.yaml
      - name: Push chart to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/kube-hardware-autoscaler-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! command -v gh >/dev/null; then
            curl -sSL https://github.com/cli/cli/releases/download/v2.63.2/gh_2.63.2_linux_amd64.tar.gz | tar xz -C /tmp
            export PATH="/tmp/gh_2.63.2_linux_amd64/bin:$PATH"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
