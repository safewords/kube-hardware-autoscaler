[package]
name = "kube-hardware-autoscaler"
version = "0.1.0"
edition = "2024"
description = "Kubernetes Hardware Autoscaler: power physical nodes on and off (IPMI, Redfish, PiKVM, Wake-on-LAN) based on cluster demand"
license = "Apache-2.0"
repository = "https://github.com/safewords/kube-hardware-autoscaler"

[dependencies]
aes = "0.9"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["block-padding", "alloc"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
getrandom = "0.4"
ipmi = { version = "0.1.2", features = ["blocking"] }
k8s-openapi = { version = "0.28.0", features = ["latest", "schemars"] }
kube = { version = "4.2.0", features = ["runtime", "derive", "client"] }
md-5 = "0.11.0"
prometheus = "0.14.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rumqttc = "0.25.1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
schemars = { version = "1.2.2", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
serde_yaml = "0.9.34"
